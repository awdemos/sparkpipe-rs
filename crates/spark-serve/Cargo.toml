[package]
name = "spark-serve"
description = "Serving plane: request/session lifecycle, HTTP gateway + SSE, serving engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
spark-core = { path = "../spark-core" }
spark-sched = { path = "../spark-sched" }
spark-text = { path = "../spark-text" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
