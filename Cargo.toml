[workspace]
resolver = "2"
members = [
    "crates/spark-abi",
    "crates/spark-sys",
    "crates/spark-core",
    "crates/spark-sched",
    "crates/spark-text",
    "crates/spark-model",
    "crates/spark-serve",
    "crates/spark-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

# Dependency policy: mirror the C project's minimalism.
# Only vetted crates; no async runtime outside the gateway.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libloading = "0.8"
libc = "0.2"
bindgen = "0.72"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
